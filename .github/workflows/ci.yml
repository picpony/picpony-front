# Every push to dev / master and every pull request: the checks that need no browser.
#
# Dependencies install from the committed `bun.lock` with `--frozen-lockfile` (review P1-F3): the
# README already makes bun the project's installer, so the lockfile it maintains is the one CI
# reproduces, and a package.json change without its lockfile update fails here instead of
# resolving differently on different days. bun only installs; every script still runs on Node.
# Node 24 matches development (`.nvmrc`), and the TS-importing scripts
# (`scripts/tsResolve.mjs`) need 22.18 or later for synchronous module hooks and type stripping
# (`engines` in package.json).
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: '--unhandled-rejections=strict'

jobs:
  verify:
    name: Typecheck, lint, unit tests, generated files, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Changed-line whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$base" HEAD -- . ":(exclude)public/companions/browserponies.js"

      - name: Test and tooling syntax
        run: |
          for script in scripts/*.mjs; do node --check "$script" || exit 1; done
          # The browser suites' Python is otherwise only compiled on the Windows job.
          python3 -m compileall -q scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The palette generator verifies its generated files and every colour assertion; a stale
      # `app/theme-palettes.css` or `lib/generated/*` fails here rather than drifting.
      - name: Colours
        run: npm run colors

      - name: Hero path
        run: npm run hero:path

      - name: Emoji table
        run: npm run emoji

      - name: Production build
        run: npm run build
