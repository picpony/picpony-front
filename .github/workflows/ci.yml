# Every push to dev / master or a `v*` tag, and every pull request: the checks that need no browser.
#
# Dependencies install from the committed `bun.lock` with `--frozen-lockfile` (review P1-F3): the
# README already makes bun the project's installer, so the lockfile it maintains is the one CI
# reproduces, and a package.json change without its lockfile update fails here instead of
# resolving differently on different days. bun only installs; every script still runs on Node.
# Node 24 matches development (`.nvmrc`), and the TS-importing scripts
# (`scripts/tsResolve.mjs`) need 22.18 or later for synchronous module hooks and type stripping
# (`engines` in package.json).
#
# On a `v*` tag or a manual run it also packages what it built into `dist/picpony-front-linux-x64/`
# and uploads that as an artifact: the standalone server with `.next/static` and `public/` copied
# in, a launcher and a README (`scripts/packageStandalone.mjs`). Nothing is built twice — the
# packaging rides the verification build, so a downloadable artifact implies the checks passed.
#
# The same run then deploys that artifact to the Ubuntu host over SSH: `scripts/deployServer.sh`
# syncs it into `/www/wwwroot/picpony-front`, restarts the BaoTa project through the panel's own
# CLI, health-checks `/sw.js`, and rolls back to the previous release if the check fails. Pull
# requests do neither, because every one of them would upload and deploy bytes nobody asked for.
name: CI

on:
  push:
    branches: [dev, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: '--unhandled-rejections=strict'

jobs:
  verify:
    name: Typecheck, lint, unit tests, generated files, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy job downloads exactly the artifact these checks produced.
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Changed-line whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$base" HEAD -- . ":(exclude)public/companions/browserponies.js"

      - name: Test and tooling syntax
        run: |
          for script in scripts/*.mjs; do node --check "$script" || exit 1; done
          # The browser suites' Python is otherwise only compiled on the Windows job.
          python3 -m compileall -q scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The palette generator verifies its generated files and every colour assertion; a stale
      # `app/theme-palettes.css` or `lib/generated/*` fails here rather than drifting.
      - name: Colours
        run: npm run colors

      - name: Hero path
        run: npm run hero:path

      - name: Emoji table
        run: npm run emoji

      # A stable id per commit rather than next.config.ts's timestamp: the client bundles and the
      # service worker's cache name carry it, so two builds of one commit should agree.
      - name: Production build
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npm run build

      # `next build` alone is not a deployment: the standalone trace leaves out `.next/static` and
      # `public/`. The script copies both in and writes `run.sh` and a README, so
      # `dist/picpony-front-linux-x64/` is the whole thing.
      - name: Package standalone artifact
        id: package
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: npm run package:standalone -- --platform linux-x64

      # Artifact names reject `/` and branch names have them; `v*` tags and `workflow_dispatch` on
      # a branch both land here, so one substitution keeps either valid.
      - name: Name the artifact
        id: artifact
        if: ${{ steps.package.outcome == 'success' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "name=picpony-front-linux-x64-${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload runnable artifact
        if: ${{ steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/picpony-front-linux-x64
          # `.next/` is a dot-directory; without this the server, its chunks and everything else
          # are dropped from the upload.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # The artifact is uploaded first and deployed second: a failed upload leaves the running release
  # untouched. `scripts/deployServer.sh` runs on the server and stops/starts the BaoTa project
  # through the panel's own CLI, so no panel API token is involved.
  deploy:
    name: Deploy to the Ubuntu server
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: pkg

      - name: Check the download
        run: |
          test -f pkg/server.js
          test -d pkg/.next/static
          test -d pkg/node_modules

      - name: SSH setup
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload the release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.run_id }}
        run: |
          ssh -p "$PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$USER@$HOST" "mkdir -p /www/wwwroot/picpony-front-releases/$RELEASE_ID"
          rsync -a --delete \
            -e "ssh -p $PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes" \
            pkg/ "$USER@$HOST:/www/wwwroot/picpony-front-releases/$RELEASE_ID/"

      - name: Restart and health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.run_id }}
        run: |
          ssh -p "$PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$USER@$HOST" "RELEASE_ID=$RELEASE_ID bash -s" < scripts/deployServer.sh
