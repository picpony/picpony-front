<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线 · PicPony</title>
    <!--
      Plain HTML with no script, and that is the whole point rather than a simplification.

      This was an `app/offline/page.tsx` first, and it did not work: the worker serves the cached
      response at the URL the user asked for, so Next hydrated a document built for `/offline`
      against `location.pathname === '/tasks'`, decided the route was `/tasks`, and re-rendered it
      — an app shell full of "加载失败" instead of an explanation. Measured exactly that. A fallback
      served under a foreign URL cannot be a routed page.

      So: no framework, no hydration, no fonts, no requests. It has to render from a cache entry
      written days ago on a build that no longer exists.

      The colours are the **default** palette's `surface` / `on-surface` / `on-surface-variant`,
      spelled out because there is no stylesheet here to read a token from. That is a knowing
      divergence from "only `--md-sys-color-*` tokens": this document is outside the design
      system's reach by construction. `testPalette.mjs` checks these values:
      when `npm run colors:write` moves the default palette, copy the six values
      from its `:root` and `.dark` blocks. The fonts are the platform's own: this page
      makes no requests, so it cannot load the app's web faces. HarmonyOS Sans is not named — on
      a desktop it exists only when installed by hand, often as a single weight that would then
      paint all of this text (the generic below reaches it where it is the system face).
    -->
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fff8f6;
        --on-surface: #221a15;
        --on-surface-variant: #52443c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #131318;
          --on-surface: #e4e1e9;
          --on-surface-variant: #c8c5d0;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--surface);
        color: var(--on-surface);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          'Noto Sans CJK SC',
          'Source Han Sans SC',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      svg {
        display: block;
        margin: 0 auto 24px;
        color: var(--on-surface-variant);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.4;
        font-weight: 400;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--on-surface-variant);
      }
    </style>
  </head>
  <body>
    <main>
      <!--
        Material Symbols' wifi_off, inlined: an external icon font is a request. The path is the
        glyph's own outline, in its native 0 -960 960 960 box. Hand-simplifying it into a 24 box
        (as this page once did) dropped the bands and left detached fragments.
      -->
      <svg width="48" height="48" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
        <path
          d="M790-56 414-434q-47 11-87.5 33T254-346l-84-86q32-32 69-56t79-42l-90-90q-41 21-76.5 46.5T84-516L0-602q32-32 66.5-57.5T140-708l-84-84 56-56 736 736-58 56Zm-310-64q-42 0-71-29.5T380-220q0-42 29-71t71-29q42 0 71 29t29 71q0 41-29 70.5T480-120Zm236-238-29-29-29-29-144-144q81 8 151.5 41T790-432l-74 74Zm160-158q-77-77-178.5-120.5T480-680q-21 0-40.5 1.5T400-674L298-776q44-12 89.5-18t92.5-6q142 0 265 53t215 145l-84 86Z"
        />
      </svg>
      <h1>当前处于离线状态</h1>
      <p>网络恢复后刷新页面即可继续浏览。</p>
    </main>
  </body>
</html>
