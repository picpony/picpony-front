<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="t d">
<title id="t">小处，也不将就</title>
<desc id="d">PicPony 的九项功能：以图搜图、中文标签、论坛、收藏夹、标签订阅、彩彩 AI、内容分级、线路加速与 PWA。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFCFC"/><stop offset="1" stop-color="#FFF8F8"/></linearGradient></defs>
<rect width="1200" height="812" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Inter, 'Noto Sans CJK SC', sans-serif">
 <text x="56" y="88" font-size="16" font-weight="700" letter-spacing="4" fill="#A93D5C">更多细节</text>
 <text x="53" y="152" font-size="48" font-weight="800" letter-spacing="1" fill="#2A1519">小处，也不将就。</text>
 <text x="56" y="196" font-size="21" font-weight="500" fill="#836A6F">图库只是开始。搜索、整理、交流，每一处都按同一套设计语言打磨。</text>
 <rect x="56.0" y="236" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="84.0" y="264" width="52" height="52" rx="16" fill="#FFD9DF" fill-opacity="1"/><g transform="translate(96.0 276) scale(1.1666666666666667)" fill="#8A1D3F"><path d="M18 13v7H4V6h5.02c.05-.71.22-1.38.48-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-5zm-1.5 5h-11l2.75-3.53 1.96 2.36 2.75-3.54zm2.8-9.11c.44-.7.7-1.51.7-2.39C20 4.01 17.99 2 15.5 2S11 4.01 11 6.5s2.01 4.5 4.49 4.5c.88 0 1.7-.26 2.39-.7L21 13.42 22.42 12zM15.5 9a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5"/></g><text x="83.0" y="352" font-size="24" font-weight="700" fill="#2A1519">以图搜图</text><text x="84.0" y="380" font-size="18" font-weight="500" fill="#836A6F">拿一张图，找到出处与同类。</text><rect x="425.3" y="236" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="453.3" y="264" width="52" height="52" rx="16" fill="#F3DAFF" fill-opacity="1"/><g transform="translate(465.3333333333333 276) scale(1.1666666666666667)" fill="#6B2E86"><path d="m12.87 15.07-2.54-2.51.03-.03A17.5 17.5 0 0 0 14.07 6H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2zm-2.62 7 1.62-4.33L19.12 17z"/></g><text x="452.3" y="352" font-size="24" font-weight="700" fill="#2A1519">中文标签</text><text x="453.3" y="380" font-size="18" font-weight="500" fill="#836A6F">常用标签附中文译名，检索不靠猜。</text><rect x="794.7" y="236" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="822.7" y="264" width="52" height="52" rx="16" fill="#D5ECFF" fill-opacity="1"/><g transform="translate(834.6666666666666 276) scale(1.1666666666666667)" fill="#1F4F7A"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1m-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1"/></g><text x="821.7" y="352" font-size="24" font-weight="700" fill="#2A1519">论坛</text><text x="822.7" y="380" font-size="18" font-weight="500" fill="#836A6F">看完图，总得有个地方聊聊。</text><rect x="56.0" y="416" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="84.0" y="444" width="52" height="52" rx="16" fill="#FFE6BF" fill-opacity="1"/><g transform="translate(96.0 456) scale(1.1666666666666667)" fill="#7A4A00"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2m-2.06 11L15 15.28 12.06 17l.78-3.33-2.59-2.24 3.41-.29L15 8l1.34 3.14 3.41.29-2.59 2.24z"/></g><text x="83.0" y="532" font-size="24" font-weight="700" fill="#2A1519">收藏夹</text><text x="84.0" y="560" font-size="18" font-weight="500" fill="#836A6F">文件夹分门别类，隐私空间另放。</text><rect x="425.3" y="416" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="453.3" y="444" width="52" height="52" rx="16" fill="#CFF5E4" fill-opacity="1"/><g transform="translate(465.3333333333333 456) scale(1.1666666666666667)" fill="#165A42"><path d="M7.58 4.08 6.15 2.65C3.75 4.48 2.17 7.3 2.03 10.5h2a8.45 8.45 0 0 1 3.55-6.42m12.39 6.42h2c-.15-3.2-1.73-6.02-4.12-7.85l-1.42 1.43a8.5 8.5 0 0 1 3.54 6.42M18 11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-6 11c.14 0 .27-.01.4-.04.65-.14 1.18-.58 1.44-1.18q.15-.36.15-.78h-4c.01 1.1.9 2 2.01 2"/></g><text x="452.3" y="532" font-size="24" font-weight="700" fill="#2A1519">标签订阅</text><text x="453.3" y="560" font-size="18" font-weight="500" fill="#836A6F">关注喜欢的标签，新图及时送达。</text><rect x="794.7" y="416" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="822.7" y="444" width="52" height="52" rx="16" fill="#FFD9DF" fill-opacity="1"/><g transform="translate(834.6666666666666 456) scale(1.1666666666666667)" fill="#8A1D3F"><path d="m19 9 1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25z"/></g><text x="821.7" y="532" font-size="24" font-weight="700" fill="#2A1519">彩彩 AI</text><text x="822.7" y="560" font-size="18" font-weight="500" fill="#836A6F">陪你看图，也能替你在站内办事。</text><rect x="56.0" y="596" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="84.0" y="624" width="52" height="52" rx="16" fill="#E1E0FF" fill-opacity="1"/><g transform="translate(96.0 636) scale(1.1666666666666667)" fill="#3A3F8F"><path d="M3 17v2h6v-2zM3 5v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></g><text x="83.0" y="712" font-size="24" font-weight="700" fill="#2A1519">内容分级</text><text x="84.0" y="740" font-size="18" font-weight="500" fill="#836A6F">分级与屏蔽组，只看想看的。</text><rect x="425.3" y="596" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="453.3" y="624" width="52" height="52" rx="16" fill="#D5ECFF" fill-opacity="1"/><g transform="translate(465.3333333333333 636) scale(1.1666666666666667)" fill="#1F4F7A"><path d="M19 15.18V7c0-2.21-1.79-4-4-4s-4 1.79-4 4v10c0 1.1-.9 2-2 2s-2-.9-2-2V8.82C8.16 8.4 9 7.3 9 6c0-1.66-1.34-3-3-3S3 4.34 3 6c0 1.3.84 2.4 2 2.82V17c0 2.21 1.79 4 4 4s4-1.79 4-4V7c0-1.1.9-2 2-2s2 .9 2 2v8.18A2.996 2.996 0 0 0 18 21c1.66 0 3-1.34 3-3 0-1.3-.84-2.4-2-2.82"/></g><text x="452.3" y="712" font-size="24" font-weight="700" fill="#2A1519">线路加速</text><text x="453.3" y="740" font-size="18" font-weight="500" fill="#836A6F">多条图片与 API 线路，按网络择优。</text><rect x="794.7" y="596" width="349.3" height="160" rx="22" fill="#FFFFFF" stroke="#F1DADF"/><rect x="822.7" y="624" width="52" height="52" rx="16" fill="#CFF5E4" fill-opacity="1"/><g transform="translate(834.6666666666666 636) scale(1.1666666666666667)" fill="#165A42"><path d="M17 18H7V6h7V1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-5h-2z"/><path d="m18 14 5-5-1.41-1.41L19 10.17V3h-2v7.17l-2.59-2.58L13 9z"/></g><text x="821.7" y="712" font-size="24" font-weight="700" fill="#2A1519">PWA</text><text x="822.7" y="740" font-size="18" font-weight="500" fill="#836A6F">装到主屏幕，离线时也有退路。</text>
</g>
